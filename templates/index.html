<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pony Express — Kits pédagogiques</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <nav class="rail" aria-label="Navigation principale">
      <a
        class="rail-icon rail-icon--active"
        href="#"
        aria-current="page"
        title="Kits pédagogiques"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
      </a>
      <a class="rail-icon" href="#" title="Calendrier">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <rect x="3" y="5" width="18" height="16" rx="2" />
          <path d="M8 3v4M16 3v4M3 10h18" />
        </svg>
      </a>
      <a class="rail-icon" href="#" title="Notifications">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z" />
          <path d="M10 20a2 2 0 0 0 4 0" />
        </svg>
      </a>
      <a class="rail-icon" href="#" title="Réglages">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.14.41.44.77.83 1H21a2 2 0 1 1 0 4h-.09c-.41.14-.77.44-1 .83Z"
          />
        </svg>
      </a>
    </nav>

    <aside class="filters">
      <h2 class="filters-title">Filtres</h2>

      <label class="field-label" for="filter-etablissement"
        >Établissement</label
      >
      <select id="filter-etablissement" class="field-select">
        <option value="">Tous les établissements</option>
      </select>

      <label class="field-label" for="search-nom">Recherche</label>
      <input
        id="search-nom"
        class="field-input"
        type="search"
        placeholder="Nom du participant"
        autocomplete="off"
      />

      <label class="field-label">Kit pédagogique</label>
      <div
        class="segmented"
        role="radiogroup"
        aria-label="Filtrer par statut d'envoi du kit pédagogique"
      >
        <button
          type="button"
          class="segmented-option is-active"
          data-filter="kit"
          data-value="tous"
        >
          Tous
        </button>
        <button
          type="button"
          class="segmented-option"
          data-filter="kit"
          data-value="envoye"
        >
          Envoyés
        </button>
        <button
          type="button"
          class="segmented-option"
          data-filter="kit"
          data-value="a_envoyer"
        >
          À envoyer
        </button>
      </div>

      <label class="field-label">Contrat financier</label>
      <div
        class="segmented"
        role="radiogroup"
        aria-label="Filtrer par statut d'envoi du contrat financier"
      >
        <button
          type="button"
          class="segmented-option is-active"
          data-filter="financier"
          data-value="tous"
        >
          Tous
        </button>
        <button
          type="button"
          class="segmented-option"
          data-filter="financier"
          data-value="envoye"
        >
          Envoyés
        </button>
        <button
          type="button"
          class="segmented-option"
          data-filter="financier"
          data-value="a_envoyer"
        >
          À envoyer
        </button>
      </div>

      <button id="btn-refresh" class="field-refresh" type="button">
        ↻ Rafraîchir depuis Grist
      </button>

      <p class="filters-count">
        <span id="count-visible">0</span> /
        <span id="count-total">0</span> dossiers
      </p>

      <label class="select-all-toggle">
        <input type="checkbox" id="toggle-select-all" />
        Tout sélectionner
      </label>

      <div class="filters-actions">
        <button id="btn-generate" class="pill pill-dark" disabled>
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87" />
          </svg>
          Générer <span id="sel-count">(0)</span>
        </button>
        <button id="btn-send" class="pill pill-dark" disabled>
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M22 2 11 13" />
            <path d="M22 2 15 22l-4-9-9-4Z" />
          </svg>
          Envoyer
        </button>
      </div>
    </aside>

    <main class="content">
      <header class="content-header">
        <h1>Kits pédagogiques</h1>
        <p class="content-sub">Démarche 128447</p>
      </header>

      <div id="cards" class="card-grid" aria-live="polite">
        <p class="empty-state">Chargement des dossiers…</p>
      </div>
    </main>

    <div id="toast" class="toast" hidden>
      <img
        id="toast-loader"
        class="toast-loader"
        src="{{ url_for('static', filename='img/loader.webp') }}"
        alt=""
        aria-hidden="true"
      />
      <canvas
        id="toast-loader-frozen"
        class="toast-loader"
        width="120"
        height="120"
        hidden
        aria-hidden="true"
      ></canvas>
      <div class="toast-body">
        <p id="toast-title" class="toast-title"></p>
        <p id="toast-progress" class="toast-progress"></p>
      </div>
      <button
        id="toast-close"
        class="toast-close"
        type="button"
        aria-label="Fermer"
      >
        ×
      </button>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
