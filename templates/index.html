<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pony Express — Kits pédagogiques</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <nav class="rail" aria-label="Navigation principale">
      <div class="rail-icon-wrap">
        <a class="rail-icon rail-icon--active" href="#" aria-current="page">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"
            />
            <path d="M22 10v6" />
            <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
          </svg>
        </a>
        <span class="rail-tooltip">Apprenant</span>
      </div>

      <div class="rail-icon-wrap">
        <a class="rail-icon" href="#">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M11.5 15H7a4 4 0 0 0-4 4v2" />
            <path
              d="M21.378 16.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"
            />
            <circle cx="10" cy="7" r="4" />
          </svg>
        </a>
        <span class="rail-tooltip">Personnel</span>
      </div>

      <div class="rail-icon-wrap">
        <a class="rail-icon" href="#">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17 21a5 5 0 00-10 0" />
            <path d="M22 10.5a3.5 3.5 0 00-5.507-2.868" />
            <path d="M7.507 7.632A3.5 3.5 0 002 10.5" />
            <circle cx="12" cy="13" r="3" />
            <circle cx="18.5" cy="4.5" r="2.5" />
            <circle cx="5.5" cy="4.5" r="2.5" />
          </svg>
        </a>
        <span class="rail-tooltip">Groupe</span>
      </div>

      <div class="rail-icon-wrap">
        <a class="rail-icon" href="#">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </a>
        <span class="rail-tooltip">Réglages</span>
      </div>
    </nav>

    <aside class="filters">
      <div class="brand">
        <img
          src="{{ url_for('static', filename='img/logo.svg') }}"
          alt=""
          class="brand-logo"
        />
        <span class="brand-name">Pony Express</span>
      </div>

      <h2 class="filters-title">Filtres</h2>

      <label class="field-label" for="filter-etablissement"
        >Établissement</label
      >
      <select id="filter-etablissement" class="field-select">
        <option value="">Tous les établissements</option>
      </select>

      <label class="field-label" for="search-nom">Recherche</label>
      <input
        id="search-nom"
        class="field-input"
        type="search"
        placeholder="Nom du participant"
        autocomplete="off"
      />

      <label class="field-label">Kit pédagogique</label>
      <div
        class="segmented"
        role="radiogroup"
        aria-label="Filtrer par statut d'envoi du kit pédagogique"
      >
        <button
          type="button"
          class="segmented-option is-active"
          data-filter="kit"
          data-value="tous"
        >
          Tous
        </button>
        <button
          type="button"
          class="segmented-option"
          data-filter="kit"
          data-value="envoye"
        >
          Envoyés
        </button>
        <button
          type="button"
          class="segmented-option"
          data-filter="kit"
          data-value="a_envoyer"
        >
          À envoyer
        </button>
      </div>

      <label class="field-label">Contrat financier</label>
      <div
        class="segmented"
        role="radiogroup"
        aria-label="Filtrer par statut d'envoi du contrat financier"
      >
        <button
          type="button"
          class="segmented-option is-active"
          data-filter="financier"
          data-value="tous"
        >
          Tous
        </button>
        <button
          type="button"
          class="segmented-option"
          data-filter="financier"
          data-value="envoye"
        >
          Envoyés
        </button>
        <button
          type="button"
          class="segmented-option"
          data-filter="financier"
          data-value="a_envoyer"
        >
          À envoyer
        </button>
      </div>

      <button id="btn-refresh" class="field-refresh" type="button">
        ↻ Rafraîchir depuis Grist
      </button>
      <button id="btn-sync-dn" class="field-refresh" type="button">
        ⇄ Vérifier avec DN
      </button>

      <p class="filters-count">
        <span id="count-visible">0</span> /
        <span id="count-total">0</span> dossiers
      </p>

      <label class="select-all-toggle">
        <input type="checkbox" id="toggle-select-all" />
        Tout sélectionner
      </label>

      <div class="filters-actions">
        <button id="btn-generate" class="pill pill-dark" disabled>
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87" />
          </svg>
          Générer <span id="sel-count">(0)</span>
        </button>
        <button id="btn-send" class="pill pill-dark" disabled>
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M22 2 11 13" />
            <path d="M22 2 15 22l-4-9-9-4Z" />
          </svg>
          Envoyer
        </button>
      </div>

      <div class="filters-brand">
        <img
          src="{{ url_for('static', filename='img/logo-moow.svg') }}"
          alt="MOOW"
          class="filters-brand-logo"
        />
        <span class="filters-brand-sub">Pro</span>
      </div>
    </aside>

    <main class="content">
      <header class="content-header">
        <h1>Mobilités Apprenant</h1>
      </header>
      <div id="cards" class="card-grid" aria-live="polite">
        <p class="empty-state">Chargement des dossiers…</p>
      </div>
    </main>

    <footer class="app-footer">
      <nav class="app-footer-legal" aria-label="Informations légales">
        <a href="#">Mentions légales</a>
        <a href="#">Accessibilité : non conforme</a>
      </nav>
      <p class="app-footer-license">
        Pony Express v1.2 — Made with
        <svg
          class="app-footer-heart"
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M12 21s-7.5-4.6-10.2-9.3C.1 8.7 1.4 5 5 4.1c2.2-.6 4.4.3 5.6 2.2.3.5 1 .5 1.3 0C13.1 4.4 15.3 3.5 17.5 4.1c3.6.9 4.9 4.6 3.2 7.6C19.5 16.4 12 21 12 21z"
          />
        </svg>
        by
        <a
          href="https://github.com/jlllyfish"
          target="_blank"
          rel="noopener noreferrer"
          >Jellyfish</a
        >
        &amp;
        <a
          href="https://github.com/edelagnier"
          target="_blank"
          rel="noopener noreferrer"
          >edelagnier</a
        >
        — Licence
        <a
          href="https://www.gnu.org/licenses/gpl-3.0.html"
          target="_blank"
          rel="noopener noreferrer"
          >GPL-3.0 ↗</a
        >
      </p>
    </footer>

    <div id="toast" class="toast" hidden>
      <img
        id="toast-loader"
        class="toast-loader"
        src="{{ url_for('static', filename='img/loader.webp') }}"
        alt=""
        aria-hidden="true"
      />
      <canvas
        id="toast-loader-frozen"
        class="toast-loader"
        width="120"
        height="120"
        hidden
        aria-hidden="true"
      ></canvas>
      <div class="toast-body">
        <p id="toast-title" class="toast-title"></p>
        <p id="toast-progress" class="toast-progress"></p>
      </div>
      <button
        id="toast-close"
        class="toast-close"
        type="button"
        aria-label="Fermer"
      >
        ×
      </button>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
