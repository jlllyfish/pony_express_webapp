{% extends "auth_base.html" %}
{% block titre %}Code de vérification{% endblock %}
{% block formulaire %}
  <p class="consigne">Saisissez le code à 6 chiffres de votre application d'authentification.</p>
  <label class="champ">
    <span class="sr-only">Code à 6 chiffres</span>
    <input type="text" name="code" placeholder="Code à 6 chiffres" inputmode="numeric" autocomplete="one-time-code"
           maxlength="9" required autofocus />
  </label>
  <button type="submit">Valider</button>
  <p class="aide">Téléphone perdu ? Saisissez un de vos codes de secours (format <code>abcd-1234</code>).</p>
  <a class="lien" href="{{ url_for('auth.connexion') }}">← Revenir à la connexion</a>
{% endblock %}
